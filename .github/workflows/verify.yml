name: Verify dashboard
on:
  pull_request:
  push:
    branches: [feature/supabase-shared-ledger]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install API dependencies
        run: npm install --prefix server --no-audit --no-fund
      - name: Test API authorization and migration schema
        run: npm test --prefix server
      - name: Check password-management script syntax
        run: node --check server/src/set-local-password.js
