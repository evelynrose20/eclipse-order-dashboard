name: Verify dashboard
on:
  pull_request:
  push:
    branches: [main, feature/supabase-shared-ledger]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: eclipse_order
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install API dependencies
        run: npm install --prefix server --no-audit --no-fund
      - name: Test Discord approval revocation and session protection
        run: node --test server/test/account-access.test.js server/test/session-membership.test.js
      - name: Test settlement power and chamber rates
        run: node --test server/test/world-power.test.js
      - name: Test chamber extraction and fluid labels
        run: node --test server/test/thralls-access.test.js
      - name: Verify chamber batch tank SQL integration
        env:
          ECLIPSE_CI_MYSQL: '1'
          ECLIPSE_CI_MYSQL_PASSWORD: test-only-password
        run: node --test server/test/chamber-batch-tanks.integration.test.js
      - name: Verify power building projects with real MySQL
        env:
          ECLIPSE_CI_MYSQL: '1'
          ECLIPSE_CI_MYSQL_PASSWORD: test-only-password
        run: node --test server/test/world-power-projects.integration.test.js
      - run: npm test
      - run: npm run build
      - name: Test API authorization and MySQL migrations
        env:
          ECLIPSE_CI_MYSQL: '1'
          ECLIPSE_CI_MYSQL_PASSWORD: test-only-password
        run: npm test --prefix server
      - name: Check password-management script syntax
        run: node --check server/src/set-local-password.js

  windows-api-manager-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell manager and installer files
        shell: pwsh
        run: |
          $paths = @('tools/windows-api-manager.ps1', 'tools/windows-api-maintenance.ps1', 'tools/install-api-manager.ps1', 'tools/uninstall-api-manager.ps1')
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error "$path : $_" }; exit 1 }
          }

  mariadb-gestation-migration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test-only-password
          MARIADB_DATABASE: eclipse_order
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -ptest-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --prefix server --no-audit --no-fund
      - name: Verify migration 132 on MariaDB 10.11, including repeat setup
        env:
          ECLIPSE_CI_GESTATION_DB: '1'
          ECLIPSE_CI_MYSQL_PASSWORD: test-only-password
        run: node --test server/test/gestation-mariadb.integration.test.js
