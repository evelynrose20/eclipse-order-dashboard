name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        env:
          # Public API URL only; no database secrets in frontend builds.
          VITE_ECLIPSE_API_URL: https://api.rosefires.com
        run: npm run build
      - name: Add GitHub Pages routes for direct navigation
        run: |
          mkdir -p dist/venue/rules dist/venue/menu dist/venue/people dist/venue dist/portal dist/app
          cp dist/index.html dist/venue/index.html
          cp dist/index.html dist/venue/menu/index.html
          cp dist/index.html dist/venue/people/index.html
          cp dist/index.html dist/venue/rules/index.html
          cp dist/index.html dist/portal/index.html
          cp dist/index.html dist/app/index.html
          cp dist/index.html dist/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
